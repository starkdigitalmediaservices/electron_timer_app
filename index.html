<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electron App</title>
  <script>
    // This code will run in the renderer process
    const myHeaders = new Headers();
  myHeaders.append("Content-Type", "application/json");
  myHeaders.append("Authorization", "Bearer GEw9vgFGZZdUDHCCeau9gVWMHwdhHj");
  
  const requestOptions = {
    method: "GET",
    headers: myHeaders,
    redirect: "follow"
  };
  
    window.onload = async () => {
      try {
        const response = await fetch('https://portalsapi.starkdigital.in/api/v1/tasks/?sort_by=id&sort_direction=descending&page=1&limit=10&tw_emp_id=203', requestOptions);
        const data = await response.json();
        console.log(data); // Log the response from the Python API
        document.getElementById('message').textContent = data.message;
      } catch (error) {
        console.error("Error calling the API:", error);
      }
    };
  </script>
</head>
<body>
  <!-- <h1 id="message">Loading data...</h1> -->
  <script src="./src/home.js"></script>  <!-- Load home.js -->
</body>
</html>
